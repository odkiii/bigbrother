# Health checks every 4 hours + Telegram digest of broken sites.
# Vercel Hobby cron (daily) remains a backup morning checkup.
#
# Auth: GitHub OIDC (no Actions secret required). Optional fallback: repo secret
# CRON_SECRET matching Vercel Production CRON_SECRET.
# Optional Actions variable BIGBROTHER_URL if the production domain changes.
#
# Alerts go to Vercel env TELEGRAM_CHAT_ID (required for digests).
name: Health check cron

on:
  schedule:
    # Every 4 hours (UTC). GitHub may delay a few minutes on free plans.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Probe mode"
        required: false
        default: deep
        type: choice
        options:
          - shallow
          - deep
          - full

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run Big Brother /api/check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BIGBROTHER_URL: ${{ vars.BIGBROTHER_URL }}
          MODE: ${{ github.event.inputs.mode || 'deep' }}
        run: |
          set -euo pipefail
          BASE="${BIGBROTHER_URL:-https://bigbrother-watchingyou.vercel.app}"
          BASE="${BASE%/}"
          URL="${BASE}/api/check?mode=${MODE}&source=github-actions&digest=1"
          echo "GET ${URL}"

          if [ -n "${CRON_SECRET:-}" ]; then
            echo "Auth: CRON_SECRET"
            TOKEN="${CRON_SECRET}"
          else
            echo "Auth: GitHub OIDC (aud=bigbrother-cron)"
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "::error::Missing OIDC token endpoint (need permissions.id-token: write)"
              exit 1
            fi
            OIDC_JSON=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=bigbrother-cron")
            TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${OIDC_JSON}")
            if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "None" ]; then
              echo "::error::Failed to fetch GitHub OIDC token"
              echo "${OIDC_JSON}" | head -c 500
              exit 1
            fi
          fi

          HTTP=$(curl -sS -o /tmp/bb-check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "User-Agent: BigBrotherGitHubCron/1.0" \
            --max-time 90 \
            "$URL")
          echo "HTTP ${HTTP}"
          head -c 2000 /tmp/bb-check.json; echo
          if [ "$HTTP" != "200" ]; then
            echo "::error:: /api/check returned HTTP ${HTTP} (deploy OIDC auth if using GitHub OIDC)"
            exit 1
          fi
          python3 - <<'PY'
          import json,sys
          d=json.load(open("/tmp/bb-check.json"))
          assert d.get("ok") is True, d
          print("checked", d.get("checked"), "alerts", d.get("alertsSent"), "digest", d.get("digestSent"), "mode", d.get("mode"))
          for r in d.get("results") or []:
              print(f"  {r.get('siteId')}: {r.get('status')} http={r.get('httpStatus')} fail={ (r.get('probeSummary') or {}).get('failed') }")
          PY
